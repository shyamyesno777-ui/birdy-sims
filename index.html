<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable !== false) {
            var currentFetch = desc.get.call(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
        } catch (_) {}

        function isExtErr(file, msg, stack) {
          var s = String(file || '') + ' ' + String(msg || '') + ' ' + String(stack || '');
          return (
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('moz-extension://') !== -1 ||
            s.indexOf('safari-extension://') !== -1 ||
            s.indexOf('Cannot set property fetch of #<Window>') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (e) {
            var stack = e.error && e.error.stack ? e.error.stack : '';
            if (isExtErr(e.filename, e.message, stack)) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var r = e.reason;
            var msg = r && r.message ? r.message : String(r || '');
            var stack = r && r.stack ? r.stack : '';
            if (isExtErr('', msg, stack)) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <div id="loading-screen" class="loading-screen" aria-live="polite">
      <div class="loading-minimal start-screen-card">
        <h1 class="start-screen-title">SPARROW RAMPAGE</h1>
        <div class="sparrow-hero-stage">

            <span class="celebrate-icon c2">✦</span>
            <span class="celebrate-icon c3">♪</span>
            <span class="celebrate-icon c4">✦</span>
            <span class="celebrate-icon c5">♥</span>
          </div>

            id="sparrow-progress"
            class="sparrow-progress"
            role="progressbar"
            aria-label="Loading"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"

            <svg viewBox="0 0 220 136" width="182" height="114" aria-hidden="true">

                  />
                  <path

                    stroke-width="3.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    fill="none"
                  />
                </g>
              </defs>
              <g class="sparrow-svg-body">
                <use href="#sparrow-silhouette-shape" class="sparrow-silhouette-base" />
                <use
                  href="#sparrow-silhouette-shape"
                  class="sparrow-silhouette-fill"
                  clip-path="url(#sparrow-fill-clip)"

                <g class="sparrow-cute-details">

                    d="M 88 74 C 105 89 144 92 167 68 C 154 78 122 81 95 69 Z"
                    fill="#f4ead8"
                    opacity="0.92"

                      stroke-width="2.4"

                    <ellipse cx="164" cy="36" rx="10" ry="7" fill="#f7efe1" opacity="0.92" />
                    <circle cx="171" cy="31" r="3.4" fill="#231c18" />
                    <circle cx="172.2" cy="29.8" r="1.2" fill="#ffffff" />
                    <ellipse cx="166" cy="39" rx="4.2" ry="2.6" fill="#eb8b84" opacity="0.72" />

        <button id="press-start-btn" class="press-start-btn is-hidden" type="button" data-start="true">
          PLAY

    </div>
    <div id="sunrise-bloom-overlay" class="sunrise-bloom-overlay" aria-hidden="true"></div>
    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
